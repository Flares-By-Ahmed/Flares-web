        <body style="animation: pageFadeIn 1.5s ease-in-out forwards;"> <!--add later it hurts my eyes-->

            <!--this will be hard-->
            <main class="cards_deck_continer">
                <div class="cards_deck" style="--gap: 23px;"> <!-- each card needs a hit box now-->
                    <div class="card_hitbox" style="--i:-2; z-index:2;" ><div  class="cards rounded-5" style="background-image:url('https://cdn2.steamgriddb.com/thumb/ce10b99820f24fb3dc769a4f9fb67672.jpg');"></div></div>
                    <div class="card_hitbox" style="--i:-1; z-index:4;" ><div  class="cards rounded-5" style="background-image:url('https://cdn2.steamgriddb.com/thumb/96f0d98a448af2cfa50f971b680d6342.jpg');"></div></div>
                    <div class="card_hitbox" style="--i:0;  z-index:6;" ><div  class="cards rounded-5" style="background-image:url('https://cdn2.steamgriddb.com/thumb/003b36afc53d4e078a9df02e0e43fb28.jpg');"></div></div>
                    <div class="card_hitbox" style="--i:1;  z-index:8;" ><div  class="cards rounded-5" style="background-image:url('https://cdn2.steamgriddb.com/thumb/d18c832e8c956b4ef8b92862e6bf470d.jpg');"></div></div>
                    <div class="card_hitbox" style="--i:2;  z-index:10;"><div  class="cards rounded-5" style="background-image:url('https://cdn2.steamgriddb.com/thumb/aa9438b02f494bf6bd595b63c3fe6535.jpg');"></div></div>
                    <p class='top_five'>My top 5 best games of all time</p>
                </div>
            </main>
<script>
            last_hoved =null; // click but for small screens
            let small_screen = false
            if (window.innerWidth < 1100)
            { 
               small_screen = true
            }
            let card_hitboxes = document.querySelectorAll('.card_hitbox');
            card_hitboxes.forEach(hitbox => {
                hitbox._onEnter = function() { hoverer(hitbox); };
                hitbox._onLeave = function() { revert(hitbox); };
                hitbox.addEventListener('mouseenter', hitbox._onEnter);
                hitbox.addEventListener('mouseleave', hitbox._onLeave);
                hitbox.addEventListener('click', function() { duck_to_row(hitbox); });
            });
            function revert(hitbox)
            {
                hitbox.style.transform = 'translateX(calc(var(--i) * var(--gap))) rotate(calc(var(--i) * 7deg)) scale(1)';
                    let cards_continer = document.querySelector('.cards_deck');
                    for (let i = 0; i < card_hitboxes.length; i++) {
                        if (card_hitboxes[i] !== hitbox) {
                            card_hitboxes[i].style.transform = 'translateX(calc(var(--i) * var(--gap))) rotate(calc(var(--i) * 7deg)) scale(1)';
                        }
                    }
            }
            function hoverer(hitbox)
            {
                if (small_screen && (last_hoved !== null)) 
                {
                    revert(hitbox);
                }
                last_hoved = hitbox;
                hitbox.style.transform = 'translateY(calc(-1 * var(--shift_up))) translateX(calc(var(--i) * var(--gap))) rotate(calc(var(--i) * 13deg)) scale(1.2)';
                    let cards_continer = document.querySelector('.cards_deck');
                    for (let i = 0; i < card_hitboxes.length; i++) {
                        if (card_hitboxes[i] !== hitbox) {
                            let pos = parseInt(card_hitboxes[i].style.getPropertyValue('--i'));
                            if (pos < parseInt(hitbox.style.getPropertyValue('--i'))) {
                                card_hitboxes[i].style.transform = 'translateX(calc((var(--i)) * var(--gap) - var(--shift_side)))  rotate(calc(var(--i) * 11deg)) scale(1)';
                            } else {
                                card_hitboxes[i].style.transform = 'translateX(calc((var(--i)) * var(--gap) + var(--shift_side))) rotate(calc(var(--i) * 11deg)) scale(1)';
                            }
                        }
                    }
            }
            let clicked = false;
                function duck_to_row(deck) 
                {
                    if (small_screen)
                    {
                        hoverer(deck)
                        return;
                    }
                    clicked = !clicked;
                    let text = document.querySelector('.top_five');
                    text.style.opacity = clicked ? '1' : '0';
                    text.style.top = clicked ? "10%" : '0%';
                    for (let i = 0; i < card_hitboxes.length; i++) 
                    {  
                        let card = card_hitboxes[i]
                    if (clicked) 
                    {
                        card.removeEventListener('mouseenter', card._onEnter); 
                        card.removeEventListener('mouseleave', card._onLeave);
                    } else
                    {
                        card.addEventListener('mouseenter', card._onEnter);
                        card.addEventListener('mouseleave', card._onLeave);
                    }
                    card.style.cssText = `--i:${(i - 2)}; z-index:${2 * i};`;
                    card.classList.toggle('spreed');
                    } 
                }
                let tour_button = document.querySelector('.tour_masked');
                tour_button.addEventListener('click', function() 
                {
                    let place = document.querySelector('.top_five');
                    place.scrollIntoView({ behavior: "smooth", block: "start" });
                });
                window.addEventListener('resize', () => {
                    if (window.innerWidth < 1100)
                        {small_screen = true}
                    });
    </script>
            <!--slider track-->
            <footer class="game_section">
                <div class="game_covers">
                    <div class="repeating_track">
                        <div class="game_cover" style="background-image:url('https://cdn2.steamgriddb.com/thumb/60789ec6e0b781a34a43ec3976ed027a.jpg');"></div>
                        <div class="game_cover" style="background-image:url('https://cdn2.steamgriddb.com/thumb/7a807be03d58378fe54cd908bcbb9454.jpg');"></div>

                        <div class="game_cover" style="background-image:url('https://cdn2.steamgriddb.com/thumb/f44910410bd7cd5713c7dc2dc493ee64.png');"></div>
                        <div class="game_cover" style="background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRUhkYNrPD49O3fTxRLVoZMxsjR3SsWEOdz1d_r2TEmgg&s=10');"></div>
                        <div class="game_cover" style="background-image:url('https://cdn2.steamgriddb.com/thumb/2ac990c336cb2f55dc06ba3c417dd250.jpg');"></div>
                        <div class="game_cover" style="background-image:url('https://cdn2.steamgriddb.com/thumb/87368138229b6995db6b5c482f90a5bf.jpg');"></div>
                    </div>
                </div>
                <p class="other_games">Other games i played</p>

            <script>    
                let hovered_index = -1;
                let cards_deck = document.querySelector('.cards_deck');
                let repeating_track = document.querySelector('.repeating_track');
                let game_covers = document.querySelector('.game_covers');
                let single_cover = document.querySelector('.game_cover');
                let pos = 0;
                let speed = 1;
                let coverwidth = single_cover.offsetWidth + parseInt(window.getComputedStyle(repeating_track).gap);// well 250 + 10 for gap
                let right_fade_zone = coverwidth * 0.8; 
                let left_fade_zone = coverwidth * 6 - right_fade_zone *1.2;
                let margin_for_hover = coverwidth * 0.3;
                let hovring_card = null;
                repeating_track.addEventListener('mouseover', (e) => {
                    const cover = e.target.closest('.game_cover');
                    if (cover) hovring_card = cover;
                });
                repeating_track.addEventListener('mouseout', (e) => {
                    const cover = e.target.closest('.game_cover');
                    if (cover === hovring_card) hovring_card = null;
                });
                function animation()
                {
                    pos -= speed;
                    if ((pos * (-1)) > coverwidth)
                    {
                        repeating_track.appendChild(repeating_track.firstElementChild);
                        pos += coverwidth;
                    }
                    repeating_track.style.transform = `translateX(${pos}px)`;
                    const containerwidth = game_covers.offsetWidth;
                    const covers = repeating_track.children;
                    hovered_index = -1;
                    for (let j = 0; j < covers.length; j++) {
                        if (covers[j] === hovring_card) {
                            hovered_index = j;
                            break;
                        }
                    }
                    for (let i = 0; i < covers.length; i++) 
                    {
                        const cover = covers[i];
                        const coverLeft = pos + (i * coverwidth);
                        const coverRight = coverLeft + coverwidth;
                        let fandness = 1;
                        if (coverRight < right_fade_zone )
                            {
                                fandness = Math.max(0, coverRight / right_fade_zone);
                            } 
                
                        if (coverLeft > left_fade_zone)
                            {
                                let rightFade = 1 - (coverLeft - left_fade_zone) / right_fade_zone; // camle case
                                fandness = Math.min(fandness, Math.max(rightFade, 0));
                            }
                        cover.style.opacity = fandness;
                        // hover effect
                        let shift = 0; let scale = 1;
                        if (hovring_card === cover) 
                            {
                                hovered_index = i;
                            }
                        if (hovered_index !== -1 && i === hovered_index)
                            {                
                                scale = 1.6;
                            }
                        else if (hovered_index !== -1 && hovered_index > i)
                            {
                                shift -= margin_for_hover;
                            }
                        else if (hovered_index !== -1 && hovered_index < i)
                            {
                                shift += margin_for_hover;
                            }
                        cover.style.transform = `translateX(${shift}px) scale(${scale})`;
                    }
                        requestAnimationFrame(animation);
                    }
                animation();
            </script>
